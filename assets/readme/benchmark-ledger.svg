<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Decision ledger: commits only versus commits plus PR discussion</title>
<desc id="desc">Measured 22 November 2026 on full history. httpx golden decisions found: 2 of 12 from commits only, 11 of 12 with PR discussion. Share of httpx records that state the reason: 19% versus 56%. Share of FastAPI records that state the reason, a repository not used for tuning: 4% versus 36%.</desc>
