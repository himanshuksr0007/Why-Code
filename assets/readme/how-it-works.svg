<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">How Why-Code works</title>
  <desc id="desc">Three stages. 1: where the reasons live — pull requests and reviews, commit messages, issues, ADRs and WHY: or DECISION: code comments. 2: code decides, with no model — mine sentences that state a reason, verify every quote against the checkout, track whether each decision is still current, and record approvals in an append-only authority log. 3: who asks — the web app, coding agents over MCP, and pull requests through a GitHub Action. A language model only writes the wording; every citation must resolve to evidence or the answer is refused.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#c9772a"/>
    </marker>
  </defs>

  <rect width="1200" height="580" rx="24" fill="#120e0c"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Column headers -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#e09a52">
      <text x="56" y="70">1 · WHERE THE WHY LIVES</text>
      <text x="400" y="70">2 · CODE DECIDES — NO MODEL</text>
      <text x="864" y="70">3 · WHO ASKS</text>
    </g>

    <!-- 1. Sources -->
    <g id="sources" font-size="20" fill="#f5eee6">
      <rect x="56" y="96" width="280" height="56" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="76" y="131">Pull requests &amp; reviews</text>
      <rect x="56" y="164" width="280" height="56" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="76" y="199">Commit messages</text>
      <rect x="56" y="232" width="280" height="56" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="76" y="267">Issues</text>
      <rect x="56" y="300" width="280" height="56" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="76" y="335">ADRs</text>
      <rect x="56" y="368" width="280" height="56" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="76" y="403" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#e9dccd">WHY: · DECISION: notes</text>
    </g>

    <path d="M346 260H388" stroke="#c9772a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- 2. Deterministic ledger -->
    <g id="ledger">
      <rect x="400" y="96" width="400" height="72" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="420" y="126" font-size="20" font-weight="600" fill="#f5eee6">Mine</text>
      <text x="420" y="154" font-size="18" fill="#b8a999">keep only sentences that state a reason</text>

      <rect x="400" y="180" width="400" height="72" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="420" y="210" font-size="20" font-weight="600" fill="#f5eee6">Verify</text>
      <text x="420" y="238" font-size="18" fill="#b8a999">every quote checked against the repo</text>

      <rect x="400" y="264" width="400" height="72" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="420" y="294" font-size="20" font-weight="600" fill="#f5eee6">Track currency</text>
      <text x="420" y="322" font-size="18" fill="#b8a999">active → needs review → stale</text>

      <rect x="400" y="348" width="400" height="72" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="420" y="378" font-size="20" font-weight="600" fill="#f5eee6">Authority log</text>
      <text x="420" y="406" font-size="18" fill="#b8a999">append-only; edits are rejected</text>
    </g>

    <path d="M810 260H852" stroke="#c9772a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- 3. Consumers -->
    <g id="consumers">
      <rect x="864" y="96" width="280" height="88" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="884" y="132" font-size="20" font-weight="600" fill="#f5eee6">Web app</text>
      <text x="884" y="162" font-size="18" fill="#b8a999">Why? and Plan modes</text>

      <rect x="864" y="200" width="280" height="88" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="884" y="236" font-size="20" font-weight="600" fill="#f5eee6">Coding agents</text>
      <text x="884" y="266" font-size="18" fill="#b8a999">MCP: ask before editing</text>

      <rect x="864" y="304" width="280" height="88" rx="14" fill="#1c1613" stroke="#3a2d23" stroke-width="1.5"/>
      <text x="884" y="340" font-size="20" font-weight="600" fill="#f5eee6">Pull requests</text>
      <text x="884" y="370" font-size="18" fill="#b8a999">Action blocks pinned changes</text>
    </g>

    <!-- The rule -->
    <rect x="56" y="456" width="1088" height="88" rx="16" fill="#1f1610" stroke="#c9772a" stroke-width="1.5"/>
    <text x="84" y="494" font-size="22" font-weight="600" fill="#f5eee6">The model only writes the wording.</text>
    <text x="84" y="526" font-size="20" fill="#b8a999">Each <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#e09a52">[E1]</tspan> must resolve to evidence from stage 1, checked by stage 2 — or the answer is refused.</text>
  </g>
</svg>
